<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>GeoAsk Investigator</title>
<meta name="description" content="Investigate Singapore from satellite imagery: search places, scrub through yearly imagery, and ask questions answered from measured pixels.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map" role="application" aria-label="Map of Singapore"></div>

<!-- Top bar: brand + place search (Google Maps-style) -->
<header class="topbar">
  <div class="brand" aria-label="GeoAsk">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#5aa9ff" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="#5aa9ff" stroke-width="1.4"/><path d="M3.5 9h17M3.5 15h17" stroke="#5aa9ff" stroke-width="1.4"/><circle cx="17.5" cy="6.5" r="2.2" fill="#e8eef6"/></svg>
    <span>GeoAsk</span>
  </div>
  <div class="search" role="combobox" aria-haspopup="listbox" aria-owns="results" aria-expanded="false" id="search">
    <svg class="icon sm" data-icon="search" aria-hidden="true"></svg>
    <label for="q" class="sr-only">Search places</label>
    <input id="q" type="search" placeholder="Search places" autocomplete="off" aria-autocomplete="list" aria-controls="results">
    <span class="kbd" aria-hidden="true" title="Press / to search">/</span>
    <ul id="results" class="results glass-regular" role="listbox" hidden></ul>
  </div>
  <span id="mode" class="mode-chip" role="status">Connecting…</span>
</header>

<!-- Ask panel (chat) -->
<aside id="panel" class="panel glass-regular" aria-labelledby="ask-title">
  <div class="panel-head">
    <h1 id="ask-title">Ask <span class="sub">· answers from satellite pixels</span></h1>
    <button class="btn-icon" id="new-chat" title="New investigation" aria-label="New investigation"><svg class="icon" data-icon="plus-square"></svg></button>
    <button class="btn-icon" id="collapse" title="Hide panel" aria-label="Hide panel"><svg class="icon" data-icon="panel-left"></svg></button>
  </div>
  <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
  <div class="composer">
    <form id="ask-form">
      <label for="ask" class="sr-only">Ask a question about a place</label>
      <textarea id="ask" rows="1" placeholder="Ask how a place has changed"></textarea>
      <button class="send" id="send" type="submit" aria-label="Ask" disabled><svg class="icon" data-icon="arrow-up"></svg></button>
    </form>
    <p class="disclosure" id="disclosure"><svg class="icon sm" data-icon="info" aria-hidden="true"></svg><span>An assistant picks the analysis; every number is measured from Sentinel-2 pixels, not generated by AI.</span></p>
  </div>
</aside>
<button class="fab" id="fab" aria-label="Show Ask panel"><svg class="icon" data-icon="message"></svg></button>

<!-- Right rail: map controls -->
<nav class="rail glass" aria-label="Map controls">
  <button class="btn-icon" id="btn-layers" title="Layers" aria-label="Layers" aria-haspopup="dialog" aria-expanded="false"><svg class="icon" data-icon="layers"></svg></button>
  <button class="btn-icon" id="btn-globe" title="3D globe and terrain" aria-label="3D globe and terrain" aria-pressed="false"><svg class="icon" data-icon="globe"></svg></button>
  <hr>
  <button class="btn-icon" id="btn-zin" title="Zoom in" aria-label="Zoom in"><svg class="icon" data-icon="plus"></svg></button>
  <button class="btn-icon" id="btn-zout" title="Zoom out" aria-label="Zoom out"><svg class="icon" data-icon="minus"></svg></button>
  <button class="btn-icon" id="btn-north" title="Reset north and tilt" aria-label="Reset north and tilt"><svg class="icon" data-icon="compass"></svg></button>
  <button class="btn-icon" id="btn-home" title="Show all of Singapore" aria-label="Show all of Singapore"><svg class="icon" data-icon="home"></svg></button>
</nav>

<!-- Layers popover -->
<div id="layers" class="popover glass-regular" role="dialog" aria-label="Layers" hidden>
  <h2>Base map</h2>
  <label class="opt"><input type="radio" name="base" value="s2" checked><span>Sentinel-2 yearly<span class="d">10 m cloud-free mosaic · EOX</span></span></label>
  <label class="opt"><input type="radio" name="base" value="hires"><span>High-resolution imagery<span class="d">Sub-metre · Esri · display only</span></span></label>
  <label class="opt"><input type="radio" name="base" value="dark"><span>Map<span class="d">Streets and labels · OpenStreetMap</span></span></label>
  <h2>Overlays</h2>
  <label class="opt"><input type="checkbox" id="ov-labels" checked><span>Place labels</span></label>
  <label class="opt"><input type="checkbox" id="ov-change" checked disabled><span>Analysis change layer<span class="d" id="ov-change-d">Ask a question to create one</span></span></label>
  <label class="opt"><input type="checkbox" id="ov-areas" checked><span>Analysis areas<span class="d">Approximate outlines</span></span></label>
</div>

<!-- Timeline: yearly imagery, or before/after of the active result -->
<footer class="timeline" id="timeline" aria-label="Timeline">
  <svg class="icon" data-icon="clock" aria-hidden="true"></svg>
  <div class="tl-main">
    <label for="tl" class="sr-only" id="tl-label">Imagery year</label>
    <input type="range" id="tl" min="2017" max="2025" step="1" value="2025">
    <div class="ticks" id="ticks" aria-hidden="true"></div>
  </div>
  <div><div class="label" id="tl-kind">Imagery year</div><div class="value" id="tl-value">2025</div></div>
</footer>

<div class="hud" id="hud" aria-hidden="true">1.3521° N  103.8198° E</div>
<div class="toast glass-regular" id="toast" role="status" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
