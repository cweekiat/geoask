[project]
name = "geoask"
version = "0.1.0"
description = "Sensor-agnostic platform for geospatial foundation models: satellite imagery analysis, change and pattern-of-life detection, asked in plain language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3.10",
  "pystac-client>=0.8",
  "pyyaml>=6",
  "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18"]
apple = ["coremltools>=8.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5"]
detect = ["sahi>=0.11"]  # optional: run any SAHI-supported detector (YOLO, torchvision, HF)

[project.scripts]
geoask = "geoask.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoask"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "geoask/_profiles"
"schemas" = "geoask/_schemas"
"data" = "geoask/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to open data buckets"]

[tool.ruff]
line-length = 100
